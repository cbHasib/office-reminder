name: Build & publish installers

# Triggers:
#   - push a tag like v0.1.0  → builds all 3 OSes + auto-publishes a public release.
#   - workflow_dispatch       → manual run from the Actions UI. Optionally tagged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.1.0). Leave empty for build-only sanity check."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write  # so the default GITHUB_TOKEN can create releases in this repo

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon (M1+). Covers all 2020+ Macs.
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Write desktop env file
        shell: bash
        run: |
          mkdir -p apps/desktop
          cat > apps/desktop/.env.local <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      # Apple signing only fires when SIGN_MACOS variable = "true" AND the cert
      # secrets are populated. Otherwise we build an unsigned .dmg.
      - name: Compose Apple signing env
        if: matrix.platform == 'macos-latest' && vars.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE_S: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_S"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_S"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S"
            echo "APPLE_ID=$APPLE_ID_S"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_S"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_S"
          } >> "$GITHUB_ENV"

      - name: Build Tauri bundle (& publish release if tagged)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName:     ${{ needs.setup.outputs.release_tag }}
          releaseName: "Office Reminder ${{ needs.setup.outputs.release_tag }}"
          releaseBody: |
            ## Office Reminder ${{ needs.setup.outputs.release_tag }}

            Pick the installer for your OS below.

            ### macOS
            - Apple Silicon (M1/M2/M3/M4): `*_aarch64.dmg`
            - First launch: right-click the app → Open → Open (unsigned build).

            ### Windows
            - `*_x64-setup.exe` or `*_x64_en-US.msi`
            - SmartScreen warning is expected. Click More info → Run anyway.

            ### Linux
            - Debian/Ubuntu: `*_amd64.deb` — `sudo dpkg -i office-reminder_*.deb`
            - Portable: `*_amd64.AppImage` — `chmod +x` then double-click.

            Built from commit ${{ github.sha }}.
          releaseDraft: false
          prerelease:   false
          args: ${{ matrix.args }}

      - name: Upload installers as workflow artifacts (build-only runs)
        if: needs.setup.outputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/**
            apps/desktop/src-tauri/target/**/release/bundle/msi/**
            apps/desktop/src-tauri/target/**/release/bundle/nsis/**
            apps/desktop/src-tauri/target/**/release/bundle/deb/**
            apps/desktop/src-tauri/target/**/release/bundle/appimage/**
