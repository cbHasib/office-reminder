name: Build & publish installers

# Triggers:
#   - push a tag like v0.1.0  → builds all 3 OSes + auto-publishes a public release.
#   - workflow_dispatch       → manual run from the Actions UI. Optionally tagged.
#
# We deliberately DON'T build on every push to main — that doubled the work when
# `git push origin main --tags` fired both a branch push AND a tag push. To sanity-
# check a build without releasing, use the manual dispatch with the tag input empty.
#
# Publishes the release to RELEASES_REPO (a public mirror) so that downloads
# work without GitHub authentication, while this source repo stays private.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.1.0). Leave empty for build-only sanity check."
        required: false
        default: ""

# Cancel any in-flight run for the same ref when a new commit lands. Tagged
# release runs are kept (they have unique refs).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read  # source repo permissions — we use RELEASES_PAT for the mirror

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag:    ${{ steps.t.outputs.tag }}
      releases_repo:  ${{ steps.t.outputs.releases_repo }}
    steps:
      - id: t
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo "releases_repo=${{ vars.RELEASES_REPO }}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon (M1+). Covers all 2020+ Macs.
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Mac build intentionally omitted — macos-13 runners queue for 20+ min
          # and modern Macs are all Apple Silicon. Re-add the macos-13 entry below
          # if anyone in your team is on a pre-2020 Intel Mac.
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Write desktop env file
        shell: bash
        run: |
          mkdir -p apps/desktop
          cat > apps/desktop/.env.local <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      # Conditionally set Apple signing env vars ONLY when the secrets exist
      # and SIGN_MACOS variable is "true". Empty strings would make Tauri try
      # (and fail) to sign with a non-existent cert, so we have to gate this.
      - name: Compose Apple signing env
        if: (matrix.platform == 'macos-latest' || matrix.platform == 'macos-13') && vars.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE_S: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_S"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_S"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S"
            echo "APPLE_ID=$APPLE_ID_S"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_S"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_S"
          } >> "$GITHUB_ENV"

      - name: Build Tauri bundle (& publish to public mirror if tagged)
        uses: tauri-apps/tauri-action@v0
        env:
          # When releasing, override the target repo to the public mirror and
          # use the fine-grained PAT that has write access to it.
          GITHUB_TOKEN: ${{ needs.setup.outputs.release_tag != '' && secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ needs.setup.outputs.release_tag != '' && needs.setup.outputs.releases_repo || github.repository }}
        with:
          projectPath: apps/desktop
          tagName:     ${{ needs.setup.outputs.release_tag }}
          releaseName: "Office Reminder ${{ needs.setup.outputs.release_tag }}"
          releaseBody: |
            ## Office Reminder ${{ needs.setup.outputs.release_tag }}

            Pick the installer for your OS below.

            ### macOS
            - Apple Silicon (M1/M2/M3/M4): `*_aarch64.dmg`
            - Intel: `*_x64.dmg`
            - First launch: right-click the app → Open → Open (unsigned build).

            ### Windows
            - `*_x64-setup.exe` or `*_x64_en-US.msi`
            - SmartScreen warning is expected. Click More info → Run anyway.

            ### Linux
            - Debian/Ubuntu: `*_amd64.deb` — `sudo dpkg -i office-reminder_*.deb`
            - Portable: `*_amd64.AppImage` — `chmod +x` then double-click.

            Built from commit ${{ github.sha }} in the private source repo.
          releaseDraft: false
          prerelease:   false
          args: ${{ matrix.args }}

      - name: Upload installers as workflow artifacts (build-only runs)
        if: needs.setup.outputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/**
            apps/desktop/src-tauri/target/**/release/bundle/msi/**
            apps/desktop/src-tauri/target/**/release/bundle/nsis/**
            apps/desktop/src-tauri/target/**/release/bundle/deb/**
            apps/desktop/src-tauri/target/**/release/bundle/appimage/**
